# 真正的构建逻辑在 video_hex 仓库的可复用模板里，这边只做调用。
name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      gradle_task:
        description: '构建任务'
        type: choice
        default: assembleRelease
        options: [assembleRelease, assembleDebug, bundleRelease]
      split_abi:
        description: '按 ABI 分包'
        type: boolean
        default: false
      abi_filters:
        description: '限制 ABI，逗号分隔；留空=全部'
        type: string
        default: ''
      version_name:
        description: '覆盖 versionName；留空=用 build.gradle 里的'
        type: string
        default: ''
      version_code:
        description: '覆盖 versionCode；留空=用 build.gradle 里的'
        type: string
        default: ''
      release_on_tag:
        description: '打 v* tag 时自动发 Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    uses: Code-xy/video_hex/.github/workflows/android-build.yml@main
    secrets: inherit
    with:
      gradle-task:    ${{ inputs.gradle_task || 'assembleRelease' }}
      split-abi:      ${{ inputs.split_abi == true && 'true' || 'false' }}
      abi-filters:    ${{ inputs.abi_filters || '' }}
      version-name:   ${{ inputs.version_name || '' }}
      version-code:   ${{ inputs.version_code || '' }}
      # 注意：tag/push 触发时 inputs.release_on_tag 是「空」，
      # 而 GH Actions 表达式里 `'' == false` 判为 true —— 直接写
      # `inputs.release_on_tag == false && 'false' || 'true'` 会得到 'false'，
      # 导致 tag 构建反而跳过 Release。必须先分流事件类型。
      release-on-tag: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_on_tag && 'true' || 'false') || 'true' }}
